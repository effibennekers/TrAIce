[project]
name = "traice-backend"
version = "0.1.0"
description = "FastAPI backend for TrAIce dashboard data"
requires-python = ">=3.13"
dependencies = [
  "fastapi>=0.142.4",
  "pydantic>=2.13.5",
  "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
  "ruff>=0.16.10",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
