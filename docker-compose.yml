name: traice

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: development
      args:
        PYTHON_VERSION: "3.13"
        PORT: 8000
    working_dir: /app
    volumes:
      - ./backend/app:/app/app
    environment:
      PORT: "8000"
      CORS_ORIGINS: http://localhost:5173,http://127.0.0.1:5173,http://localhost:8080,http://127.0.0.1:8080
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'python -c "import urllib.request; urllib.request.urlopen(''http://127.0.0.1:8000/health'').read()"',
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 5s

  dashboard:
    build:
      context: ./dashboard
      dockerfile: Dockerfile
      target: development
      args:
        NODE_VERSION: 26
        PORT: 5173
    working_dir: /app
    volumes:
      - ./dashboard:/app
      - /app/node_modules
    environment:
      PORT: "5173"
      VITE_API_BASE_URL: /api
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'node -e "require(''http'').get(''http://127.0.0.1:5173/'', (res) => process.exit(res.statusCode === 200 ? 0 : 1)).on(''error'', () => process.exit(1))"',
        ]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 20s

  nginx:
    image: nginx:1.27-alpine@sha256:65645c7bb6a0661892a8b03b89d0743208a18dd2f3f17a54ef4b76fb8e2f2a10
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "8080:80"
    depends_on:
      dashboard:
        condition: service_healthy
      backend:
        condition: service_healthy
